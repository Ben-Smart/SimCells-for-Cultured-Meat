<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#162040"/>
    </linearGradient>
    <linearGradient id="mtnFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"   stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2038"/>
    </linearGradient>
    <radialGradient id="ballG" cx="38%" cy="32%" r="58%">
      <stop offset="0%"   stop-color="#f8fafc"/>
      <stop offset="80%"  stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="ballGold" cx="38%" cy="32%" r="58%">
      <stop offset="0%"   stop-color="#fef9c3"/>
      <stop offset="80%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#fbbf24" flood-opacity="0.6" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="gbl"/>
      <feMerge><feMergeNode in="gbl"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L5,3 L0,5.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arrGold" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L5,3 L0,5.5 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="420" height="260" fill="url(#skyGrad)" rx="10"/>

  <!-- Stars -->
  <circle cx="15"  cy="12" r="0.7" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="55"  cy="8"  r="0.9" fill="#e2e8f0" opacity="0.4"/>
  <circle cx="100" cy="15" r="0.6" fill="#e2e8f0" opacity="0.5"/>
  <circle cx="160" cy="6"  r="0.8" fill="#e2e8f0" opacity="0.3"/>
  <circle cx="370" cy="10" r="0.7" fill="#e2e8f0" opacity="0.45"/>
  <circle cx="400" cy="20" r="0.6" fill="#e2e8f0" opacity="0.4"/>

  <!-- Mountain range body -->
  <path d="M0,230
           L0,185 L35,210 L60,175 L90,215
           L120,155 L145,195
           L175,100 L195,145
           L220,68  L240,115
           L270,80  L295,125
           L330,95  L360,130
           L390,105 L420,140
           L420,260 L0,260 Z"
        fill="url(#mtnFill)"/>

  <!-- Mountain ridge line -->
  <path d="M0,185 L35,210 L60,175 L90,215
           L120,155 L145,195
           L175,100 L195,145
           L220,68  L240,115
           L270,80  L295,125
           L330,95  L360,130
           L390,105 L420,140"
        fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>

  <!-- Snow caps on highest peaks -->
  <path d="M172,100 L175,93 L178,100 Z" fill="white" opacity="0.7"/>
  <path d="M218,68  L221,60 L224,68 Z"  fill="white" opacity="0.8"/>
  <path d="M268,80  L271,72 L274,80 Z"  fill="white" opacity="0.65"/>
  <path d="M328,95  L331,87 L334,95 Z"  fill="white" opacity="0.6"/>
  <path d="M388,105 L391,97 L394,105 Z" fill="white" opacity="0.55"/>

  <!-- Global optimum marker at peak x≈220 -->
  <line x1="221" y1="59" x2="221" y2="34" stroke="#fbbf24" stroke-width="1"
        stroke-dasharray="3,2" opacity="0.8"/>
  <text x="221" y="28" fill="#fbbf24" font-size="8.5" text-anchor="middle"
        font-weight="600">best fit</text>

  <!-- Ball 1: far left, rolling right — small (low weight) -->
  <!-- position: on slope between valley (90,215) and peak (120,155) -->
  <circle cx="105" cy="173" r="9"  fill="url(#ballG)" filter="url(#glow)"/>
  <path d="M97,170 Q105,174 113,170" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <line x1="116" y1="162" x2="130" y2="152" stroke="#64748b" stroke-width="1.2"
        marker-end="url(#arr)"/>

  <!-- Ball 2: heading toward global peak, on slope -->
  <!-- position: between local valley (195,145) and global peak (220,68) -->
  <circle cx="200" cy="130" r="10" fill="url(#ballG)" filter="url(#glow)"/>
  <path d="M191,126 Q200,130 209,126" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <line x1="207" y1="118" x2="215" y2="95" stroke="#64748b" stroke-width="1.2"
        marker-end="url(#arr)"/>

  <!-- Ball 3: at the global maximum (best fit) — highlighted gold -->
  <circle cx="221" cy="52" r="13" fill="url(#ballGold)" filter="url(#goldGlow)"/>
  <path d="M211,48 Q221,53 231,48" fill="none" stroke="#92400e" stroke-width="1.2"/>
  <circle cx="221" cy="52" r="15" fill="none" stroke="#fbbf24" stroke-width="1.5"
          opacity="0.6"/>

  <!-- Ball 4: right peak, rolling toward global -->
  <!-- position: near right peak (270,80) on way to global -->
  <circle cx="253" cy="95" r="9"  fill="url(#ballG)" filter="url(#glow)"/>
  <path d="M245,91 Q253,96 261,91" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <line x1="248" y1="87" x2="235" y2="76" stroke="#64748b" stroke-width="1.2"
        marker-end="url(#arr)"/>

  <!-- Ball 5: far right, small weight -->
  <circle cx="360" cy="118" r="8"  fill="url(#ballG)" filter="url(#glow)" opacity="0.8"/>
  <path d="M353,114 Q360,118 367,114" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <line x1="354" y1="111" x2="340" y2="103" stroke="#64748b" stroke-width="1"
        marker-end="url(#arr)"/>

  <!-- Axis labels -->
  <text x="210" y="252" fill="#475569" font-size="9" text-anchor="middle">
    Parameter space
  </text>
  <text x="10" y="145" fill="#475569" font-size="9" text-anchor="middle"
        transform="rotate(-90,10,145)">Log-likelihood</text>

  <!-- Legend -->
  <rect x="300" y="170" width="115" height="72" rx="6"
        fill="#0f172a" fill-opacity="0.7" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="315" cy="187" r="7"  fill="url(#ballG)"/>
  <text x="327" y="191" fill="#94a3b8" font-size="8.5">particle sample</text>
  <circle cx="315" cy="207" r="7"  fill="url(#ballG)"/>
  <line x1="320" y1="202" x2="327" y2="196" stroke="#64748b" stroke-width="1"
        marker-end="url(#arr)"/>
  <text x="327" y="211" fill="#94a3b8" font-size="8.5">weight update</text>
  <circle cx="315" cy="227" r="7"  fill="url(#ballGold)"/>
  <circle cx="315" cy="227" r="9"  fill="none" stroke="#fbbf24" stroke-width="1"/>
  <text x="327" y="231" fill="#fbbf24" font-size="8.5">highest weight</text>
</svg>
