<svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <linearGradient id="liqGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"   stop-color="#bfdbfe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="gelGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"   stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="gelTex" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="5" cy="5" r="1.6" fill="#34d399" fill-opacity="0.35"/>
    </pattern>
    <!-- arrow marker -->
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="320" height="300" fill="#0f172a" rx="10"/>

  <!-- ── Beaker outer glass ── -->
  <!-- Slight taper: top slightly wider than bottom -->
  <path d="M90,30 L80,270 L240,270 L230,30 Z"
        fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
  <!-- Beaker rim -->
  <line x1="82" y1="30" x2="238" y2="30" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Glass sheen -->
  <path d="M95,38 L88,255" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round"/>

  <!-- ── Gel (bottom half, inside beaker) ── -->
  <!-- Gel fills lower ~50% of beaker interior -->
  <!-- At y=150 (mid), inner width: left wall at ~85+3, right wall at ~235-3 -->
  <clipPath id="beakerClip">
    <path d="M83,31 L82,269 L238,269 L237,31 Z"/>
  </clipPath>

  <!-- Gel region -->
  <rect x="83" y="150" width="154" height="119" fill="url(#gelGrad)" clip-path="url(#beakerClip)" opacity="0.85"/>
  <rect x="83" y="150" width="154" height="119" fill="url(#gelTex)"  clip-path="url(#beakerClip)"/>

  <!-- Liquid region -->
  <rect x="83" y="31" width="154" height="119" fill="url(#liqGrad)" clip-path="url(#beakerClip)"/>

  <!-- ── Interface line (gel surface) ── -->
  <line x1="83" y1="150" x2="237" y2="150"
        stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- ── Molecule dots in liquid (top half) ── -->
  <!-- larger dots = higher concentration in liquid at t=0 -->
  <circle cx="112" cy="65"  r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="148" cy="82"  r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="185" cy="58"  r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="210" cy="95"  r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="128" cy="118" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="170" cy="105" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="100" cy="100" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="200" cy="130" r="5" fill="#f59e0b" opacity="0.85"/>

  <!-- ── Molecule dots in gel (top of gel, fewer = diffusion front) ── -->
  <circle cx="120" cy="165" r="3.5" fill="#f59e0b" opacity="0.65"/>
  <circle cx="160" cy="172" r="3.5" fill="#f59e0b" opacity="0.65"/>
  <circle cx="205" cy="160" r="3.5" fill="#f59e0b" opacity="0.55"/>
  <!-- deeper in gel, even fewer -->
  <circle cx="140" cy="205" r="2.5" fill="#f59e0b" opacity="0.35"/>
  <circle cx="185" cy="215" r="2.5" fill="#f59e0b" opacity="0.30"/>

  <!-- ── Downward diffusion arrows ── -->
  <line x1="160" y1="138" x2="160" y2="148" stroke="#94a3b8" stroke-width="1.2"
        marker-end="url(#arr)" opacity="0.7"/>
  <line x1="135" y1="140" x2="130" y2="148" stroke="#94a3b8" stroke-width="1.2"
        marker-end="url(#arr)" opacity="0.7"/>
  <line x1="190" y1="138" x2="195" y2="148" stroke="#94a3b8" stroke-width="1.2"
        marker-end="url(#arr)" opacity="0.7"/>

  <!-- ── Labels ── -->
  <!-- Liquid label -->
  <text x="252" y="90" fill="#93c5fd" font-size="12" font-weight="600">Liquid</text>
  <text x="252" y="106" fill="#93c5fd" font-size="12" font-weight="600">medium</text>
  <line x1="238" y1="90" x2="250" y2="90" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Gel label -->
  <text x="252" y="205" fill="#34d399" font-size="12" font-weight="600">Hydrogel</text>
  <line x1="238" y1="210" x2="250" y2="210" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Interface label -->
  <text x="28" y="148" fill="#7dd3fc" font-size="10" text-anchor="end">Gel</text>
  <text x="28" y="160" fill="#7dd3fc" font-size="10" text-anchor="end">surface</text>

  <!-- Molecule legend -->
  <circle cx="95"  cy="288" r="5" fill="#f59e0b"/>
  <text x="105" y="292" fill="#94a3b8" font-size="10">Tracer molecule — concentration decreases with depth into gel</text>
</svg>
